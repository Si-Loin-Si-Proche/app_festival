name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - web-app

# Permissions pour écrire sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Build for web (Expo)
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_PROJECT_ID: ${{ vars.EXPO_PUBLIC_PROJECT_ID }}
          EXPO_PUBLIC_FESTIVAL_TAG_ID: ${{ vars.EXPO_PUBLIC_FESTIVAL_TAG_ID }}
          EXPO_PUBLIC_FESTIVAL_ID: ${{ vars.EXPO_PUBLIC_FESTIVAL_ID }}
          EXPO_PUBLIC_FESTIVAL_START_DATE: ${{ vars.EXPO_PUBLIC_FESTIVAL_START_DATE }}
          EXPO_PUBLIC_FESTIVAL_END_DATE: ${{ vars.EXPO_PUBLIC_FESTIVAL_END_DATE }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

      - name: 🔍 Debug — vérification du baseUrl dans index.html
        run: |
          echo "=== Structure dist/ ==="
          ls -la dist/
          echo ""
          echo "=== Script src dans index.html ==="
          grep -o 'src="[^"]*"' dist/index.html | head -5 || echo "Pas de balise script src trouvée"

      - name: 🔧 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
