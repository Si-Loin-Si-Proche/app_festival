name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Android
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile production --non-interactive --wait --json)
          ARTIFACT_URL=$(echo $BUILD_OUTPUT | jq -r '.[0].artifacts.buildUrl')
          curl -L $ARTIFACT_URL -o SiLoinSiProche.apk

      - name: 🚀 Submit Android to Play Store
        if: ${{ vars.ENABLE_STORE_SUBMIT == 'true' }}
        run: eas submit --platform android --profile production --non-interactive

      - name: 🚀 Build & Submit iOS to App Store
        if: ${{ vars.ENABLE_STORE_SUBMIT == 'true' }}
        run: eas build --platform ios --profile production --non-interactive --submit --wait

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SiLoinSiProche.apk
          generate_release_notes: true
          draft: false
          prerelease: false
