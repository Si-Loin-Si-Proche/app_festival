name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Android (Always)
        run: eas build --platform android --profile production --non-interactive --wait

      - name: 🚀 Submit Android to Play Store
        if: ${{ vars.ENABLE_STORE_SUBMIT == 'true' }}
        run: eas submit --platform android --profile production --non-interactive

      - name: 🚀 Build & Submit iOS to App Store
        if: ${{ vars.ENABLE_STORE_SUBMIT == 'true' }}
        run: eas build --platform ios --profile production --non-interactive --submit --wait

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          # Note: Pour attacher automatiquement les binaires, il faut télécharger les artefacts d'EAS
          # Ce qui nécessite un script pour parser l'URL de l'artefact depuis l'API Expo.
          # Le mode `draft: true` vous permet d'avoir la release prête et d'ajouter les binaires à la main.
